<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Pamart Closet — Inventory</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f7f4f0,#151311);--surface:light-dark(#fff,#211e1b);--surface2:light-dark(#f3eee8,#292521);--text:light-dark(#211d1a,#f5f0ea);--muted:light-dark(#756d65,#bdb3aa);--border:light-dark(#e4ddd5,#403a34);--accent:#8b4a62;--accent2:#b86d86;--green:#3d8064;--amber:#ad762d;--red:#b54c50;--shadow:0 12px 35px #00000012}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:var(--bg)}
.topbar{height:68px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 26px;background:var(--surface)}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{width:38px;height:38px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:900}.brand small{display:block;color:var(--muted);font-weight:500;font-size:11px}.userpill{display:flex;gap:10px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:800;color:var(--accent)}
.layout{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 68px)}.sidebar{border-right:1px solid var(--border);padding:20px 14px;background:var(--surface)}.navtitle{font-size:11px;text-transform:uppercase;color:var(--muted);padding:12px 12px 7px;letter-spacing:.08em}.nav button{width:100%;border:0;background:transparent;color:var(--text);text-align:left;padding:11px 12px;border-radius:9px;margin:2px 0}.nav button:hover,.nav button.active{background:var(--surface2);color:var(--accent);font-weight:700}.content{padding:28px;max-width:1450px;width:100%;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}.pagehead h1{margin:0;font-size:27px}.pagehead p{margin:5px 0 0;color:var(--muted);font-size:13px}.primary{background:var(--accent);border:0;color:#fff;padding:11px 16px;border-radius:9px;font-weight:750}.secondary{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:9px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:17px;box-shadow:var(--shadow)}.label{color:var(--muted);font-size:12px}.value{font-size:25px;font-weight:800;margin-top:7px}.trend{font-size:11px;margin-top:7px;color:var(--green)}.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.section{background:var(--surface);border:1px solid var(--border);border-radius:13px;overflow:hidden}.sectionhead{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.sectionhead h3{margin:0;font-size:15px}.sectionbody{padding:18px}.bars{display:grid;gap:14px}.barrow{display:grid;grid-template-columns:105px 1fr 55px;align-items:center;gap:10px;font-size:12px}.track{height:9px;background:var(--surface2);border-radius:10px;overflow:hidden}.fill{height:100%;background:var(--accent);border-radius:10px}.activity{display:grid;gap:13px}.act{display:flex;gap:11px;align-items:flex-start}.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:5px}.act b{font-size:12px}.act span{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.tablewrap{overflow:auto}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.search{flex:1;min-width:220px;padding:11px 13px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text)}select,input{padding:10px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--border);font-size:12px;white-space:nowrap}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:var(--surface2)}.status{display:inline-flex;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:800}.available{background:#dff1e8;color:#28684e}.sold{background:#f4e1e7;color:#8b4a62}.returned{background:#f7ead0;color:#8a5b1f}.cancelled{background:#f4dede;color:#9d3d40}.pill{font-size:11px;padding:4px 7px;border-radius:6px;background:var(--surface2)}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%}.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.modalbox{width:min(650px,100%);background:var(--surface);border-radius:16px;border:1px solid var(--border);padding:22px;box-shadow:0 30px 80px #0005}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{margin:0;font-size:20px}.close{border:0;background:var(--surface2);color:var(--text);width:34px;height:34px;border-radius:50%}.check{display:flex;gap:8px;align-items:center;font-size:12px;margin-top:4px}.check input{width:auto}.notice{padding:11px 13px;background:var(--surface2);border-radius:9px;color:var(--muted);font-size:12px;margin-bottom:16px}.hidden{display:none}.empty{padding:35px;text-align:center;color:var(--muted)}
@media(max-width:950px){.layout{grid-template-columns:1fr}.sidebar{display:none}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.content{padding:18px}}@media(max-width:550px){.cards{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.pagehead{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><div class="mark">P</div><div>The Pamart Closet<small>Inventory Management System</small></div></div><div class="userpill"><div><b style="font-size:12px">Admin</b><small style="display:block;color:var(--muted);font-size:10px">All Shops</small></div><div class="avatar">A</div></div></header>
<div class="layout">
<aside class="sidebar"><nav class="nav">
<div class="navtitle">Main</div><button class="active" data-page="dashboard" onclick="navigateTo('dashboard')">▦ &nbsp; Dashboard</button><button data-page="inventory" onclick="navigateTo('inventory')">▤ &nbsp; Inventory</button><button data-page="sales" onclick="navigateTo('sales')">₵ &nbsp; Sales</button><button data-page="returns" onclick="navigateTo('returns')">↩ &nbsp; Returns & Replacements</button>
<div class="navtitle">Management</div><button data-page="categories" onclick="navigateTo('categories')">◈ &nbsp; Categories</button><button data-page="users" onclick="navigateTo('users')">♙ &nbsp; Users & Permissions</button><button data-page="shops" onclick="navigateTo('shops')">⌂ &nbsp; Shops</button>
<div class="navtitle">Reports</div><button data-page="reports" onclick="navigateTo('reports')">▥ &nbsp; Reports</button><button data-page="activity" onclick="navigateTo('activity')">◷ &nbsp; Activity Log</button>
</nav></aside>
<main class="content" id="content"></main>
</div></div>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle"></h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script>
const state={page:'dashboard',inventory:[
{id:'000125',serial:'SN-2026-00125',code:'MS-00125',cat:"Men's Shirts",desc:'Blue long-sleeve shirt',shop:'Shop A',buy:800,best:1500,actual:null,status:'AVAILABLE',added:'03/10/2026',sold:null,addedBy:'Mary',soldBy:null},
{id:'000126',serial:'SN-2026-00126',code:'MS-00126',cat:"Men's Shirts",desc:'Black casual shirt',shop:'Shop A',buy:900,best:1600,actual:1500,status:'SOLD',added:'02/10/2026',sold:'03/10/2026',addedBy:'Mary',soldBy:'Mary'},
{id:'000127',serial:'SN-2026-00127',code:'SH-00127',cat:"Men's Shoes",desc:'Brown leather shoes',shop:'Shop B',buy:1800,best:2800,actual:null,status:'AVAILABLE',added:'01/10/2026',sold:null,addedBy:'John',soldBy:null},
{id:'000128',serial:'SN-2026-00128',code:'KS-00128',cat:"Kids' Sweaters",desc:'Red kids sweater',shop:'Shop B',buy:700,best:1200,actual:1100,status:'SOLD',added:'01/10/2026',sold:'02/10/2026',addedBy:'John',soldBy:'John'},
{id:'000129',serial:'SN-2026-00129',code:'HB-00129',cat:'Handbags',desc:'Black structured handbag',shop:'Shop A',buy:1200,best:2200,actual:null,status:'RETURNED',added:'28/09/2026',sold:'30/09/2026',addedBy:'Mary',soldBy:'Mary'}],
categories:["Men's Shirts","Men's Shoes","Kids' Sweaters","Handbags","Ladies' Dresses","Men's Trousers"],users:[{name:'Admin',shop:'All Shops',role:'Administrator',add:true,all:true,reports:true},{name:'Mary',shop:'Shop A',role:'User',add:true,all:false,reports:false},{name:'John',shop:'Shop B',role:'User',add:false,all:false,reports:false}],shops:['Shop A','Shop B']};
state.returns=[{original:'HB-00129',soldDate:'30/09/2026',returnDate:'30/09/2026',reason:'Customer exchange',replacement:'HB-00131',processedBy:'Admin'}];
function money(n){return n==null?'—':'KSh '+Number(n).toLocaleString()}
function status(s){return `<span class="status ${s.toLowerCase()}">${s}</span>`}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));const c=document.getElementById('content');({dashboard:dashboard,inventory:inventory,sales:sales,returns:returns,categories:categories,users:users,shops:shops,reports:reports,activity:activity}[state.page]||dashboard)(c)}
function head(title,sub,button){return `<div class="pagehead"><div><h1>${title}</h1><p>${sub}</p></div>${button||''}</div>`}
function dashboard(c){const available=state.inventory.filter(x=>x.status==='AVAILABLE').length,sold=state.inventory.filter(x=>x.status==='SOLD').length,rev=state.inventory.reduce((a,x)=>a+(x.actual||0),0);c.innerHTML=head('Inventory Dashboard','The Pamart Closet · All shops',`<button class="primary" onclick="openAdd()">+ Add Stock</button>`)+`<div class="cards"><div class="card"><div class="label">Total Stock Records</div><div class="value">${state.inventory.length}</div><div class="trend">Across all shops</div></div><div class="card"><div class="label">Available Items</div><div class="value">${available}</div><div class="trend">Currently in stock</div></div><div class="card"><div class="label">Sold Items</div><div class="value">${sold}</div><div class="trend">Recorded sales</div></div><div class="card"><div class="label">Recorded Sales</div><div class="value">${money(rev)}</div><div class="trend">Gross sales value</div></div></div><div class="grid2"><section class="section"><div class="sectionhead"><h3>Stock by Category</h3><span class="pill">Live</span></div><div class="sectionbody bars">${state.categories.slice(0,6).map(cat=>{let n=state.inventory.filter(x=>x.cat===cat).length;return `<div class="barrow"><span>${cat}</span><div class="track"><div class="fill" style="width:${Math.max(5,n/state.inventory.length*100)}%"></div></div><b>${n}</b></div>`}).join('')}</div></section><section class="section"><div class="sectionhead"><h3>Recent Activity</h3><button class="secondary" onclick="state.page='activity';render()">View all</button></div><div class="sectionbody activity"><div class="act"><i class="dot"></i><div><b>Mary sold MS-00126</b><span>Shop A · 03/10/2026 · KSh 1,500</span></div></div><div class="act"><i class="dot"></i><div><b>John added KS-00128</b><span>Shop B · 01/10/2026</span></div></div><div class="act"><i class="dot"></i><div><b>Admin processed HB-00129 return</b><span>Shop A · 30/09/2026</span></div></div></div></section></div>`
function inventory(c){c.innerHTML=head('Inventory','Search and manage individual stock records',(pamartProfile?.role==='ADMIN'||pamartProfile?.can_add_stock)?`<button class="primary" onclick="openAdd()">+ Add Stock</button>`:'')+`<div class="toolbar"><input class="search" id="invSearch" placeholder="Search code, serial number or description..." oninput="filterInv()"><select id="shopFilter" onchange="filterInv()"><option>All Shops</option>${state.shops.map(s=>`<option>${s}</option>`).join('')}</select><select id="statusFilter" onchange="filterInv()"><option>All Statuses</option><option>AVAILABLE</option><option>SOLD</option><option>RETURNED</option><option>CANCELLED</option></select></div><section class="section"><div class="tablewrap"><table><thead><tr><th>Code</th><th>Serial</th><th>Category</th><th>Description</th><th>Shop</th><th>Buying</th><th>Best Price</th><th>Actual</th><th>Sold</th><th>Status</th><th>Date Added</th><th>Date Sold</th><th>Action</th></tr></thead><tbody id="invRows"></tbody></table></div></section>`;filterInv()}
function filterInv(){const q=(document.getElementById('invSearch')?.value||'').toLowerCase(),sh=document.getElementById('shopFilter')?.value||'All Shops',st=document.getElementById('statusFilter')?.value||'All Statuses';const rows=state.inventory.filter(x=>(sh==='All Shops'||x.shop===sh)&&(st==='All Statuses'||x.status===st)&&(!q||[x.code,x.serial,x.desc,x.cat].join(' ').toLowerCase().includes(q)));document.getElementById('invRows').innerHTML=rows.map(x=>`<tr><td><b>${x.code}</b></td><td>${x.serial}</td><td>${x.cat}</td><td>${x.desc}</td><td>${x.shop}</td><td>${money(x.buy)}</td><td>${money(x.best)}</td><td>${money(x.actual)}</td><td>${x.status==='SOLD'?'☑':'☐'}</td><td>${status(x.status)}</td><td>${x.added}</td><td>${x.sold||'—'}</td><td>${x.status==='AVAILABLE'?`<button class="secondary" onclick="openSale('${x.code}')">Sell</button>`:x.status==='RETURNED'?`<button class="secondary" onclick="openReturn('${x.code}')">Return</button>`:'—'}</td></tr>`).join('')||`<tr><td colspan="13" class="empty">No matching inventory.</td></tr>`}
function sales(c){const sold=state.inventory.filter(x=>x.status==='SOLD');c.innerHTML=head('Sales','Confirmed sales and automatically recorded selling dates')+`<section class="section"><div class="tablewrap"><table><thead><tr><th>Item</th><th>Shop</th><th>Buying</th><th>Actual Selling</th><th>Profit</th><th>Sold By</th><th>Date Sold</th></tr></thead><tbody>${sold.map(x=>`<tr><td><b>${x.code}</b><br><span style="color:var(--muted)">${x.desc}</span></td><td>${x.shop}</td><td>${money(x.buy)}</td><td>${money(x.actual)}</td><td><b>${money(x.actual-x.buy)}</b></td><td>${x.soldBy}</td><td>${x.sold}</td></tr>`).join('')}</tbody></table></div></section>`}
function returns(c){c.innerHTML=head('Returns & Replacements','Track returned items without deleting their history',`<button class="primary" onclick="openReturn()">+ Record Return</button>`)+`<section class="section"><div class="tablewrap"><table><thead><tr><th>Original Item</th><th>Sold Date</th><th>Return Date</th><th>Reason</th><th>Replacement</th><th>Processed By</th><th>Status</th></tr></thead><tbody>${state.returns.map(r=>{const x=state.inventory.find(i=>i.code===r.original);return `<tr><td><b>${r.original}</b><br><span style="color:var(--muted)">${x?.desc||'Original item'}</span></td><td>${r.soldDate}</td><td>${r.returnDate}</td><td>${r.reason}</td><td><b>${r.replacement||'—'}</b></td><td>${r.processedBy}</td><td>${status('RETURNED')}</td></tr>`}).join('')||`<tr><td colspan="7" class="empty">No returns recorded.</td></tr>`}</tbody></table></div></section><div class="notice" style="margin-top:16px">Returned items remain in the audit trail. The original sale is never erased.</div>`}
function categories(c){c.innerHTML=head('Categories / Modules','Admin-managed product categories',`<button class="primary" onclick="openCategory()">+ Add Category</button>`)+`<div class="cards">${state.categories.map((x,i)=>`<div class="card"><div class="label">Category ${String(i+1).padStart(2,'0')}</div><div class="value" style="font-size:17px">${x}</div><div class="trend">${state.inventory.filter(y=>y.cat===x).length} inventory records</div></div>`).join('')}</div>`}
function users(c){c.innerHTML=head('Users & Permissions','Control what each shop user can see and do',`<button class="primary" onclick="openUser()">+ Create User</button>`)+`<section class="section"><div class="tablewrap"><table><thead><tr><th>User</th><th>Shop</th><th>Role</th><th>Add Stock</th><th>View All Inventory</th><th>Reports</th><th>Stock Removal</th><th>Action</th></tr></thead><tbody>${state.users.map(u=>`<tr><td><b>${u.name}</b></td><td>${u.shop}</td><td>${u.role}</td><td>${u.add?'✓':'—'}</td><td>${u.all?'✓':'—'}</td><td>${u.reports?'✓':'—'}</td><td>${u.role==='Administrator'?'✓':'Admin only'}</td><td><button class="secondary" onclick="openPermissions('${u.name}')">Edit</button></td></tr>`).join('')}</tbody></table></div></section><div class="notice" style="margin-top:16px"><b>Security rule:</b> “View all inventory” and “Add stock” are separate permissions. Stock cancellation/removal remains Admin-only.</div>`}
function shops(c){c.innerHTML=head('Shops','Manage Pamart branches',`<button class="primary" onclick="openShop()">+ Add Shop</button>`)+`<div class="cards">${state.shops.map(s=>{let n=state.inventory.filter(x=>x.shop===s).length;return `<div class="card"><div class="label">Branch</div><div class="value" style="font-size:19px">${s}</div><div class="trend">${n} inventory records</div></div>`}).join('')}</div>`}
function reports(c){c.innerHTML=head('Reports','Run reports by user, shop, activity and date range')+`<div class="toolbar"><select><option>All Users</option><option>Mary</option><option>John</option></select><select><option>All Shops</option><option>Shop A</option><option>Shop B</option></select><input type="date" value="2026-10-01"><input type="date" value="2026-10-03"><button class="primary" onclick="alert('Demo report generated for the selected filters.')">Run Report</button></div><div class="cards"><div class="card"><div class="label">Items Added</div><div class="value">3</div></div><div class="card"><div class="label">Items Sold</div><div class="value">2</div></div><div class="card"><div class="label">Sales</div><div class="value">KSh 2,600</div></div><div class="card"><div class="label">Gross Profit</div><div class="value">KSh 1,200</div></div></div><section class="section"><div class="sectionhead"><h3>User activity summary</h3><span class="pill">01/10/2026 – 03/10/2026</span></div><div class="tablewrap"><table><thead><tr><th>User</th><th>Shop</th><th>Added</th><th>Sold</th><th>Sales</th><th>Profit</th></tr></thead><tbody><tr><td>Mary</td><td>Shop A</td><td>2</td><td>1</td><td>KSh 1,500</td><td>KSh 600</td></tr><tr><td>John</td><td>Shop B</td><td>1</td><td>1</td><td>KSh 1,100</td><td>KSh 400</td></tr></tbody></table></div></section>`}
function activity(c){c.innerHTML=head('Activity Log','Immutable-style record of important user actions')+`<section class="section"><div class="tablewrap"><table><thead><tr><th>Date</th><th>Time</th><th>User</th><th>Shop</th><th>Action</th><th>Item</th><th>Details</th></tr></thead><tbody>${[['03/10/2026','09:10','Mary','Shop A','Added stock','MS-00125','KSh 800 buying'],['03/10/2026','11:20','Mary','Shop A','Sold item','MS-00126','KSh 1,500'],['02/10/2026','14:10','John','Shop B','Sold item','KS-00128','KSh 1,100'],['30/09/2026','16:05','Admin','Shop A','Processed return','HB-00129','Replacement HB-00131']].map(r=>`<tr>${r.map((v,i)=>`<td>${i===4?`<b>${v}</b>`:v}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('show')};function closeModal(){document.getElementById('modal').classList.remove('show')}
function openAdd(){openModal('Add Stock',`<div class="notice">The system automatically records the date, time and user who entered the item.</div><div class="formgrid"><div class="field"><label>Shop</label><select id="fshop">${state.shops.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Category</label><select id="fcat">${state.categories.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Serial Number</label><input id="fserial" placeholder="SN-2026-00130"></div><div class="field"><label>Item Code</label><input id="fcode" placeholder="MS-00130"></div><div class="field full"><label>Item Description</label><input id="fdesc" placeholder="Describe the item"></div><div class="field"><label>Buying Price</label><input id="fbuy" type="number" placeholder="800"></div><div class="field"><label>Best Selling Price</label><input id="fbest" type="number" placeholder="1500"></div><div class="field"><label>Actual Selling Price (leave blank until sold)</label><input id="fact" type="number" placeholder="—"></div></div><div style="display:flex;justify-content:flex-end;gap:9px;margin-top:20px"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveStock()">Save Stock</button></div>`)}
async function saveStock(){if(!pamartProfile?.can_add_stock&&pamartProfile?.role!=='ADMIN'){alert('You do not have permission to add stock.');return}const serial=document.getElementById('fserial').value.trim(),code=document.getElementById('fcode').value.trim(),catName=document.getElementById('fcat').value,shopName=document.getElementById('fshop').value,desc=document.getElementById('fdesc').value.trim(),buy=Number(document.getElementById('fbuy').value),best=Number(document.getElementById('fbest').value);if(!serial||!code||!desc||!buy||!best){alert('Please complete serial number, item code, description, buying price and best selling price.');return}const {data:shop,error:shopErr}=await pamartDb.from('shops').select('id').eq('name',shopName).single();const {data:cat,error:catErr}=await pamartDb.from('categories').select('id').eq('name',catName).single();if(shopErr||catErr||!shop||!cat){alert('Could not resolve the selected shop or category.');return}const {data:item,error}=await pamartDb.from('inventory_items').insert({serial_no:serial,item_code:code,category_id:cat.id,description:desc,shop_id:shop.id,buying_price:buy,best_selling_price:best,entered_by:(await pamartDb.auth.getUser()).data.user.id}).select().single();if(error){alert(error.message);return}await pamartDb.from('activity_log').insert({user_id:(await pamartDb.auth.getUser()).data.user.id,shop_id:shop.id,action:'Added stock',entity_type:'inventory_item',entity_id:item.id,details:{item_code:code,serial_no:serial,buying_price:buy,best_selling_price:best}});closeModal();await pamartLoad();}
function openCategory(){openModal('Add Category',`<div class="field"><label>Category name</label><input id="newcat" placeholder="e.g. Ladies' Handbags"></div><div style="display:flex;justify-content:flex-end;margin-top:20px"><button class="primary" onclick="saveCategory()">Save Category</button></div>`)}
async function saveCategory(){if(pamartProfile?.role!=='ADMIN'){alert('Admin permission required.');return}const v=document.getElementById('newcat').value.trim();if(!v)return;const {error}=await pamartDb.from('categories').insert({name:v});if(error){alert(error.message);return}closeModal();await pamartLoad();state.page='categories';render()}
async function saveShop(){if(pamartProfile?.role!=='ADMIN'){alert('Admin permission required.');return}const v=document.getElementById('newshop').value.trim();if(!v)return;const code='SHOP-'+v.toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,20);const {error}=await pamartDb.from('shops').insert({name:v,code});if(error){alert(error.message);return}closeModal();await pamartLoad();state.page='shops';render()}

<script>
function pamartDate(v){return v?new Date(v).toLocaleDateString('en-GB'):'—'}
async function pamartLoad(){const q=await pamartDb.from('inventory_items').select('id,serial_no,item_code,description,shop_id,buying_price,best_selling_price,actual_selling_price,status,entered_at,sold_at,entered_by,sold_by,categories(name),shops(name)').order('entered_at',{ascending:false});if(q.error){alert(q.error.message);return}state.inventory=(q.data||[]).map(x=>({id:x.id,serial:x.serial_no,code:x.item_code,cat:x.categories?.name||'—',desc:x.description,shop:x.shops?.name||'—',buy:+x.buying_price,best:+x.best_selling_price,actual:x.actual_selling_price==null?null:+x.actual_selling_price,status:x.status,added:pamartDate(x.entered_at),sold:pamartDate(x.sold_at),addedRaw:x.entered_at,soldRaw:x.sold_at,addedById:x.entered_by,soldById:x.sold_by}));const shopRows=(await pamartDb.from('shops').select('id,name').eq('active',true).order('name')).data||[];state.shops=shopRows.map(x=>x.name);state.shopRows=shopRows;state.categories=(await pamartDb.from('categories').select('name').eq('active',true).order('name')).data?.map(x=>x.name)||[];state.users=[];if(pamartProfile?.role==='ADMIN'){const p=await pamartDb.from('profiles').select('id,full_name,role,shop_id,can_add_stock,can_sell,can_view_reports,can_view_activity,can_view_all_inventory,active,shops(name)').order('full_name');state.users=(p.data||[]).map(u=>({id:u.id,name:u.full_name||'Unnamed',shop:u.shops?.name||'All Shops',shopId:u.shop_id,role:u.role==='ADMIN'?'Administrator':'User',add:u.can_add_stock,sell:u.can_sell,all:u.can_view_all_inventory,reports:u.can_view_reports,activity:u.can_view_activity,active:u.active}))}else if(pamartProfile){state.users=[{id:pamartProfile.id,name:pamartProfile.full_name||'Current user',shop:'Assigned Shop',shopId:pamartProfile.shop_id,role:'User',add:pamartProfile.can_add_stock,sell:pamartProfile.can_sell,all:pamartProfile.can_view_all_inventory,reports:pamartProfile.can_view_reports,activity:pamartProfile.can_view_activity,active:pamartProfile.active}]}const r=await pamartDb.from('returns').select('id,original_item_id,replacement_item_id,return_reason,returned_at,returned_by').order('returned_at',{ascending:false});state.returns=(r.data||[]).map(x=>({id:x.id,originalId:x.original_item_id,replacementId:x.replacement_item_id,reason:x.return_reason,returnDate:pamartDate(x.returned_at),processedBy:(state.users.find(u=>u.id===x.returned_by)||{}).name||'—'}));state.activity=[];if(pamartProfile?.role==='ADMIN'||pamartProfile?.can_view_activity){const a=await pamartDb.from('activity_log').select('id,user_id,action,details,created_at,shops(name)').order('created_at',{ascending:false}).limit(200);const names=new Map(state.users.map(u=>[u.id,u.name]));state.activity=(a.data||[]).map(x=>({created_at:x.created_at,user:names.get(x.user_id)||'—',shop:x.shops?.name||'—',action:x.action,item:x.details?.item_code||'—',details:x.details?JSON.stringify(x.details):'—'}))}render()}
function users(c){c.innerHTML=head('Users & Permissions','Live user access and permissions',`<button class="primary" onclick="openUser()">+ Create User</button>`)+`<section class="section"><div class="tablewrap"><table><thead><tr><th>User</th><th>Shop</th><th>Role</th><th>Add Stock</th><th>Record Sales</th><th>All Inventory</th><th>Reports</th><th>Activity</th><th>Removal</th><th>Action</th></tr></thead><tbody>${state.users.map(u=>`<tr><td><b>${u.name}</b></td><td>${u.shop}</td><td>${u.role}</td><td>${u.add?'✓':'—'}</td><td>${u.sell?'✓':'—'}</td><td>${u.all?'✓':'—'}</td><td>${u.reports?'✓':'—'}</td><td>${u.activity?'✓':'—'}</td><td>${u.role==='Administrator'?'✓':'Admin only'}</td><td>${u.id===pamartProfile?.id?'—':`<button class="secondary" onclick="openPermissions('${u.id}')">Edit</button>`}</td></tr>`).join('')}</tbody></table></div></section>`}
function openPermissions(id){const u=state.users.find(x=>x.id===id);if(!u)return;openModal('Edit Permissions',`<div class="notice"><b>${u.name}</b> · ${u.shop}<br>Stock cancellation remains Admin-only.</div><div class="check"><input id="eadd" type="checkbox" ${u.add?'checked':''}> Allow user to add stock</div><div class="check"><input id="eall" type="checkbox" ${u.all?'checked':''}> Allow user to see all inventory</div><div class="check"><input id="ereports" type="checkbox" ${u.reports?'checked':''}> Allow user to view reports</div><div class="check"><input id="eactivity" type="checkbox" ${u.activity?'checked':''}> Allow user to view activity</div><div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="primary" onclick="savePermissions('${u.id}')">Save Permissions</button></div>`)}
async function savePermissions(id){if(pamartProfile?.role!=='ADMIN'){alert('Admin permission required.');return}const {error}=await pamartDb.from('profiles').update({can_add_stock:document.getElementById('eadd').checked,can_view_all_inventory:document.getElementById('eall').checked,can_view_reports:document.getElementById('ereports').checked,can_view_activity:document.getElementById('eactivity').checked,updated_at:new Date().toISOString()}).eq('id',id);if(error){alert(error.message);return}closeModal();await pamartLoad();state.page='users';render()}
function openCancel(code){if(pamartProfile?.role!=='ADMIN'){alert('Admin permission required.');return}const x=state.inventory.find(i=>i.code===code);if(!x)return;openModal('Cancel Stock Record',`<div class="notice"><b>${x.code}</b> · ${x.desc}<br>The record is cancelled, not deleted.</div><div class="field"><label>Cancellation reason</label><input id="cancelReason" placeholder="Wrong item entered"></div><div style="display:flex;justify-content:flex-end;gap:9px;margin-top:18px"><button class="secondary" onclick="closeModal()">Back</button><button class="primary" onclick="saveCancel('${x.id}')">Confirm Cancellation</button></div>`)}

function filterInv(){const q=(document.getElementById('invSearch')?.value||'').toLowerCase(),sh=document.getElementById('shopFilter')?.value||'All Shops',st=document.getElementById('statusFilter')?.value||'All Statuses',rows=state.inventory.filter(x=>(sh==='All Shops'||x.shop===sh)&&(st==='All Statuses'||x.status===st)&&(!q||[x.code,x.serial,x.desc,x.cat].join(' ').toLowerCase().includes(q)));document.getElementById('invRows').innerHTML=rows.map(function(x){var action='—';if(x.status==='AVAILABLE'&&(pamartProfile?.role==='ADMIN'||pamartProfile?.can_sell))action='<button class="secondary" onclick="openSale(\''+x.code+'\')">Sell</button>';else if(x.status==='SOLD'&&(pamartProfile?.role==='ADMIN'||pamartProfile?.can_sell))action='<button class="secondary" onclick="openReturn(\''+x.code+'\')">Return</button>';else if(pamartProfile?.role==='ADMIN'&&x.status!=='CANCELLED')action='<button class="secondary" onclick="openCancel(\''+x.code+'\')">Cancel</button>';return '<tr><td><b>'+x.code+'</b></td><td>'+x.serial+'</td><td>'+x.cat+'</td><td>'+x.desc+'</td><td>'+x.shop+'</td><td>'+money(x.buy)+'</td><td>'+money(x.best)+'</td><td>'+money(x.actual)+'</td><td>'+(x.status==='SOLD'?'☑':'☐')+'</td><td>'+status(x.status)+'</td><td>'+x.added+'</td><td>'+(x.sold||'—')+'</td><td>'+action+'</td></tr>'}).join('')||'<tr><td colspan="13" class="empty">No matching inventory.</td></tr>'}
function openReturn(code){if(pamartProfile?.role!=='ADMIN'&&!pamartProfile?.can_sell){alert('You do not have permission to process returns.');return}const sold=state.inventory.filter(x=>x.status==='SOLD'),selected=code||sold[0]?.code;openModal('Record Return',`<div class="formgrid"><div class="field full"><label>Original Item</label><select id="returnItem">${sold.map(x=>`<option value="${x.id}" ${x.code===selected?'selected':''}>${x.code} — ${x.desc}</option>`).join('')}</select></div><div class="field"><label>Return Reason</label><select id="returnReason"><option>Wrong size</option><option>Customer exchange</option><option>Defective item</option><option>Wrong item</option><option>Other</option></select></div><div class="field"><label>Replacement Item</label><select id="replacementItem"><option value="">No replacement</option>${state.inventory.filter(x=>x.status==='AVAILABLE').map(x=>`<option value="${x.id}">${x.code} — ${x.desc}</option>`).join('')}</select></div></div><div class="notice">The original sale is retained. A selected replacement is linked to this return.</div><div style="display:flex;justify-content:flex-end;gap:9px"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveReturn()">Save Return</button></div>`)}
async function saveReturn(){const originalId=document.getElementById('returnItem').value,replacementId=document.getElementById('replacementItem').value||null,reason=document.getElementById('returnReason').value,{error}=await pamartDb.rpc('process_return',{p_original_item_id:originalId,p_reason:reason,p_replacement_item_id:replacementId});if(error){alert(error.message);return}closeModal();await pamartLoad();state.page='returns';render()}
function reports(c){if(pamartProfile?.role!=='ADMIN'&&!pamartProfile?.can_view_reports){c.innerHTML=head('Reports','You do not have permission to view reports');return}const n=new Date(),s=new Date(n);s.setDate(s.getDate()-6);c.innerHTML=head('Reports','Live sales, stock and user activity reports')+`<div class="toolbar"><select id="repUser" onchange="renderReportResults()"><option value="">All Users</option>${state.users.map(u=>`<option value="${u.id}">${u.name}</option>`).join('')}</select><select id="repShop" onchange="renderReportResults()"><option value="">All Shops</option>${state.shops.map(x=>`<option>${x}</option>`).join('')}</select><input id="repFrom" type="date" value="${s.toISOString().slice(0,10)}" onchange="renderReportResults()"><input id="repTo" type="date" value="${n.toISOString().slice(0,10)}" onchange="renderReportResults()"></div><div id="reportResults"></div>`;renderReportResults()}
function renderReportResults(){const uid=document.getElementById('repUser')?.value||'',shop=document.getElementById('repShop')?.value||'',from=document.getElementById('repFrom')?.value||'',to=document.getElementById('repTo')?.value||'',range=d=>d&&(!from||new Date(d).toISOString().slice(0,10)>=from)&&(!to||new Date(d).toISOString().slice(0,10)<=to),added=state.inventory.filter(x=>(!shop||x.shop===shop)&&(!uid||x.addedById===uid)&&range(x.addedRaw)),sold=state.inventory.filter(x=>x.status==='SOLD'&&(!shop||x.shop===shop)&&(!uid||x.soldById===uid)&&range(x.soldRaw)),sales=sold.reduce((a,x)=>a+(x.actual||0),0),profit=sold.reduce((a,x)=>a+(x.actual||0)-(x.buy||0),0);document.getElementById('reportResults').innerHTML=`<div class="cards"><div class="card"><div class="label">Items Added</div><div class="value">${added.length}</div></div><div class="card"><div class="label">Items Sold</div><div class="value">${sold.length}</div></div><div class="card"><div class="label">Sales</div><div class="value">${money(sales)}</div></div><div class="card"><div class="label">Gross Profit</div><div class="value">${money(profit)}</div></div></div><section class="section"><div class="sectionhead"><h3>User activity summary</h3><span class="pill">${from} – ${to}</span></div><div class="tablewrap"><table><thead><tr><th>User</th><th>Shop</th><th>Added</th><th>Sold</th><th>Sales</th><th>Profit</th></tr></thead><tbody>${state.users.map(u=>{const a=added.filter(x=>x.addedById===u.id),z=sold.filter(x=>x.soldById===u.id);return `<tr><td>${u.name}</td><td>${u.shop}</td><td>${a.length}</td><td>${z.length}</td><td>${money(z.reduce((v,x)=>v+(x.actual||0),0))}</td><td>${money(z.reduce((v,x)=>v+(x.actual||0)-(x.buy||0),0))}</td></tr>`}).join('')}</tbody></table></div></section>`}
function activity(c){if(pamartProfile?.role!=='ADMIN'&&!pamartProfile?.can_view_activity){c.innerHTML=head('Activity Log','You do not have permission to view activity');return}c.innerHTML=head('Activity Log','Live record of important user actions')+`<section class="section"><div class="tablewrap"><table><thead><tr><th>Date</th><th>Time</th><th>User</th><th>Shop</th><th>Action</th><th>Item</th><th>Details</th></tr></thead><tbody>${(state.activity||[]).map(a=>`<tr><td>${new Date(a.created_at).toLocaleDateString('en-GB')}</td><td>${new Date(a.created_at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</td><td>${a.user}</td><td>${a.shop}</td><td><b>${a.action}</b></td><td>${a.item}</td><td>${a.details}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No activity recorded yet.</td></tr>'}</tbody></table></div></section>`}
</script>
<script>
function dashboard(c){var a=state.inventory.filter(function(x){return x.status==='AVAILABLE'}).length,s=state.inventory.filter(function(x){return x.status==='SOLD'}),p=s.reduce(function(n,x){return n+(x.actual||0)-(x.buy||0)},0);c.innerHTML=head('Inventory Dashboard','The Pamart Closet · Live database',(pamartProfile&& (pamartProfile.role==='ADMIN'||pamartProfile.can_add_stock))?'<button class="primary" onclick="openAdd()">+ Add Stock</button>':'')+'<div class="cards"><div class="card"><div class="label">Total Stock Records</div><div class="value">'+state.inventory.length+'</div><div class="trend">All accessible records</div></div><div class="card"><div class="label">Available Items</div><div class="value">'+a+'</div><div class="trend">Currently in stock</div></div><div class="card"><div class="label">Sold Items</div><div class="value">'+s.length+'</div><div class="trend">Confirmed sales</div></div><div class="card"><div class="label">Gross Profit</div><div class="value">'+money(p)+'</div><div class="trend">Live calculation</div></div></div><div class="grid2"><section class="section"><div class="sectionhead"><h3>Stock by Category</h3><span class="pill">Live</span></div><div class="sectionbody bars">'+state.categories.map(function(cat){var n=state.inventory.filter(function(x){return x.cat===cat}).length,pc=state.inventory.length?Math.max(5,n/state.inventory.length*100):5;return '<div class="barrow"><span>'+cat+'</span><div class="track"><div class="fill" style="width:'+pc+'%"></div></div><b>'+n+'</b></div>'}).join('')+'</div></section><section class="section"><div class="sectionhead"><h3>Recent Activity</h3><button class="secondary" onclick="state.page=\'activity\';render()">View all</button></div><div class="sectionbody activity">'+(state.activity||[]).slice(0,5).map(function(x){return '<div class="act"><i class="dot"></i><div><b>'+x.action+'</b><span>'+x.user+' · '+x.shop+' · '+new Date(x.created_at).toLocaleString('en-GB')+'</span></div></div>'}).join('')+'</div></section></div>'}
function sales(c){var sold=state.inventory.filter(function(x){return x.status==='SOLD'});c.innerHTML=head('Sales','Confirmed sales from the live inventory ledger')+'<section class="section"><div class="tablewrap"><table><thead><tr><th>Item</th><th>Shop</th><th>Buying</th><th>Actual Selling</th><th>Profit</th><th>Sold By</th><th>Date Sold</th></tr></thead><tbody>'+sold.map(function(x){var u=state.users.find(function(v){return v.id===x.soldById});return '<tr><td><b>'+x.code+'</b><br><span style="color:var(--muted)">'+x.desc+'</span></td><td>'+x.shop+'</td><td>'+money(x.buy)+'</td><td>'+money(x.actual)+'</td><td><b>'+money((x.actual||0)-x.buy)+'</b></td><td>'+((u&&u.name)||'—')+'</td><td>'+((x.sold)||'—')+'</td></tr>'}).join('')||'<tr><td colspan="7" class="empty">No sales recorded.</td></tr>'+'</tbody></table></div></section>'}
function returns(c){var rows=(state.returns||[]).map(function(r){var o=state.inventory.find(function(i){return i.id===r.originalId}),rep=state.inventory.find(function(i){return i.id===r.replacementId});return '<tr><td><b>'+((o&&o.code)||r.originalId)+'</b><br><span style="color:var(--muted)">'+((o&&o.desc)||'Original item')+'</span></td><td>'+((o&&o.sold)||'—')+'</td><td>'+r.returnDate+'</td><td>'+r.reason+'</td><td>'+((rep)?'<b>'+rep.code+'</b><br><span style="color:var(--muted)">'+rep.desc+'</span>':'—')+'</td><td>'+r.processedBy+'</td><td>'+status(rep?'REPLACED':'RETURNED')+'</td></tr>'}).join('');if(!rows)rows='<tr><td colspan="7" class="empty">No returns recorded.</td></tr>';c.innerHTML=head('Returns & Replacements','Original sales remain preserved while replacement relationships are tracked',(pamartProfile?.role==='ADMIN'||pamartProfile?.can_sell)?'<button class="primary" onclick="openReturn()">+ Record Return</button>':'')+'<section class="section"><div class="tablewrap"><table><thead><tr><th>Original Item</th><th>Original Sale</th><th>Return Date</th><th>Reason</th><th>Replacement</th><th>Processed By</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div></section><div class="notice" style="margin-top:16px">The original item and original sale are never deleted. Replacement items are linked to the return record.</div>'}
function openPermissions(id){var u=state.users.find(function(x){return x.id===id});if(!u)return;var shops=(state.shopRows||[]).map(function(s){return '<option value="'+s.id+'" '+(s.id===u.shopId?'selected':'')+'>'+s.name+'</option>'}).join('');openModal('Edit User Permissions','<div class="notice"><b>'+u.name+'</b> · '+u.shop+'<br>Stock cancellation/removal remains Admin-only.</div><div class="field" style="margin-bottom:14px"><label>Assigned Shop</label><select id="eshop" '+(u.role==='Administrator'?'disabled':'')+'><option value="">No shop assigned</option>'+shops+'</select></div><div class="check"><input id="eactive" type="checkbox" '+(u.active!==false?'checked':'')+'> Account active</div><div class="check"><input id="eadd" type="checkbox" '+(u.add?'checked':'')+'> Allow user to add stock</div><div class="check"><input id="esell" type="checkbox" '+(u.sell?'checked':'')+'> Allow user to record sales</div><div class="check"><input id="eall" type="checkbox" '+(u.all?'checked':'')+'> Allow user to see all inventory</div><div class="check"><input id="ereports" type="checkbox" '+(u.reports?'checked':'')+'> Allow user to view reports</div><div class="check"><input id="eactivity" type="checkbox" '+(u.activity?'checked':'')+'> Allow user to view activity</div><div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="primary" onclick="savePermissions(\''+u.id+'\')">Save Changes</button></div>')}
async function savePermissions(id){if(!pamartProfile||pamartProfile.role!=='ADMIN'){alert('Admin permission required.');return}var target=state.users.find(function(x){return x.id===id});var selectedShop=document.getElementById('eshop')?.value||null;var payload={active:document.getElementById('eactive').checked,shop_id:target?.role==='Administrator'?null:selectedShop,can_add_stock:document.getElementById('eadd').checked,can_sell:document.getElementById('esell').checked,can_view_all_inventory:document.getElementById('eall').checked,can_view_reports:document.getElementById('ereports').checked,can_view_activity:document.getElementById('eactivity').checked,updated_at:new Date().toISOString()};var r=await pamartDb.from('profiles').update(payload).eq('id',id);if(r.error){alert(r.error.message);return}closeModal();await pamartLoad();state.page='users';render()}
</script>
<script>
function navigateTo(page){state.page=page;render()}
document.addEventListener('click',function(e){
  var b=e.target.closest('.nav button');
  if(!b)return;
  e.preventDefault();
  var page=b.dataset.page;
  if(!page)return;
  state.page=page;
  render();
});
</script></body></html>
